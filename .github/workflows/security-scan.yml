name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

jobs:
  ruby-security:
    name: Ruby Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Brakeman
        run: gem install brakeman bundler-audit

      - name: Run bundler-audit on Detection Engine
        run: |
          cd 02_detection_engine
          bundle install --quiet
          bundle-audit check --update || true

      - name: Run bundler-audit on Honeypot
        run: |
          cd 05_honeypot
          bundle install --quiet
          bundle-audit check --update || true

  python-security:
    name: Python Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install safety bandit

      - name: Run safety check
        run: |
          cd 03_ml_classifier
          safety check -r requirements.txt || true

      - name: Run bandit
        run: |
          cd 03_ml_classifier
          bandit -r . -f json -o /tmp/bandit-report.json || true
          bandit -r . -ll || true

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images for scanning
        run: |
          cd 07_infrastructure/docker/base
          docker build -f Dockerfile.ruby -t ruby-guardian-ruby:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ruby-guardian-ruby:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
