# =============================================================================
# RubyGuardian - Detection Agent Deployment
# =============================================================================
# Deploys the real-time behavioral detection engine that monitors Ruby
# processes via syscall tracing, network analysis, and file-system watches.
#
# The agent runs as a DaemonSet so every node in the cluster is monitored.
# It requires privileged access for eBPF / ptrace capabilities.
# =============================================================================

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: detection-agent
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: detection-agent
    app.kubernetes.io/component: detection
    app.kubernetes.io/part-of: rubyguardian
    app.kubernetes.io/version: "1.0.0"
  annotations:
    description: "Real-time Ruby process behavioral detection agent"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: detection-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detection-agent
        app.kubernetes.io/component: detection
        app.kubernetes.io/part-of: rubyguardian
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: detection-agent
      hostPID: true
      hostNetwork: false
      terminationGracePeriodSeconds: 30

      # Tolerate all taints so the agent runs everywhere
      tolerations:
        - operator: Exists

      initContainers:
        - name: init-wait-elasticsearch
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Elasticsearch to become ready..."
              until wget -qO- http://elasticsearch-svc.rubyguardian.svc.cluster.local:9200/_cluster/health 2>/dev/null | grep -qE '"status":"(green|yellow)"'; do
                echo "  Elasticsearch not ready, retrying in 5s..."
                sleep 5
              done
              echo "Elasticsearch is ready."
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: detection-agent
          image: rubyguardian/detection-agent:1.0.0
          imagePullPolicy: IfNotPresent

          command:
            - bundle
            - exec
            - ruby
            - 02_detection_engine/agent/detection_agent.rb
            - --daemonize

          ports:
            - name: http-health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          env:
            - name: RUBY_GUARDIAN_COMPONENT
              value: detection_engine
            - name: RUBY_GUARDIAN_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: detection-config
                  key: log_level
            - name: RUBY_GUARDIAN_LOG_FORMAT
              value: json
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: detection-config
                  key: elasticsearch_url
            - name: ALERT_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: detection-config
                  key: alert_level
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_PTRACE
                - SYS_ADMIN
                - NET_ADMIN

          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: detection-rules
              mountPath: /opt/rubyguardian/config/rules
              readOnly: true

          livenessProbe:
            httpGet:
              path: /health
              port: http-health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http-health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: detection-rules
          configMap:
            name: detection-config
            items:
              - key: rules.yml
                path: rules.yml

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: detection-agent
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: detection-agent
    app.kubernetes.io/part-of: rubyguardian

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rubyguardian-detection-agent
  labels:
    app.kubernetes.io/name: detection-agent
    app.kubernetes.io/part-of: rubyguardian
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rubyguardian-detection-agent
  labels:
    app.kubernetes.io/name: detection-agent
    app.kubernetes.io/part-of: rubyguardian
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rubyguardian-detection-agent
subjects:
  - kind: ServiceAccount
    name: detection-agent
    namespace: rubyguardian
