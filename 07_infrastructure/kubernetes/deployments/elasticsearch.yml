# =============================================================================
# RubyGuardian - Elasticsearch StatefulSet
# =============================================================================
# Deploys a single-node Elasticsearch cluster for storing detection alerts,
# honeypot telemetry, ML classification results, and forensic reports.
#
# For production use, increase replicas and configure proper discovery.
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: rubyguardian
    app.kubernetes.io/version: "8.11.3"
  annotations:
    description: "Elasticsearch cluster for RubyGuardian telemetry and event storage"
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  revisionHistoryLimit: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: rubyguardian
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9114"
    spec:
      serviceAccountName: elasticsearch
      terminationGracePeriodSeconds: 120

      initContainers:
        # Elasticsearch requires vm.max_map_count >= 262144
        - name: init-sysctl
          image: busybox:1.36
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        # Fix data directory permissions
        - name: init-chown
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 1000:1000 /usr/share/elasticsearch/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP

          env:
            - name: cluster.name
              value: rubyguardian-cluster
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: bootstrap.memory_lock
              value: "true"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rubyguardian-secrets
                  key: elasticsearch_password
                  optional: true
            - name: path.repo
              value: /usr/share/elasticsearch/snapshots

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              add:
                - IPC_LOCK
              drop:
                - ALL

          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
            - name: es-snapshots
              mountPath: /usr/share/elasticsearch/snapshots

          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30

        # --- Elasticsearch Exporter (Prometheus metrics) -------------------
        - name: es-exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
          args:
            - --es.uri=http://localhost:9200
            - --es.all
            - --es.indices
          ports:
            - name: metrics
              containerPort: 9114
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: es-snapshots
          emptyDir:
            sizeLimit: 10Gi

  volumeClaimTemplates:
    - metadata:
        name: es-data
        labels:
          app.kubernetes.io/name: elasticsearch
          app.kubernetes.io/part-of: rubyguardian
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: rubyguardian

---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: rubyguardian
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
    - name: transport
      port: 9300
      targetPort: transport

---
# Logstash deployment — sits between detection agents / honeypot and ES
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: rubyguardian
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: rubyguardian
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.3
          ports:
            - name: beats
              containerPort: 5044
              protocol: TCP
            - name: http
              containerPort: 9600
              protocol: TCP
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: ELASTICSEARCH_HOST
              value: http://elasticsearch-svc.rubyguardian.svc.cluster.local:9200
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/pipeline
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: logstash-pipeline
          configMap:
            name: logstash-pipeline
            optional: true
