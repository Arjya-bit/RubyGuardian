# =============================================================================
# RubyGuardian - Honeypot Deployment
# =============================================================================
# Deploys the decoy application stack: fake Rails app, fake gem server, and
# fake CI runner.  All three share a capture-data PVC for centralized
# telemetry collection.  The pods run with minimal privileges.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: honeypot
    app.kubernetes.io/component: deception
    app.kubernetes.io/part-of: rubyguardian
    app.kubernetes.io/version: "1.0.0"
  annotations:
    description: "Deceptive honeypot services for attacker engagement and telemetry capture"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: honeypot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honeypot
        app.kubernetes.io/component: deception
        app.kubernetes.io/part-of: rubyguardian
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9292"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: honeypot
      terminationGracePeriodSeconds: 15

      initContainers:
        - name: init-capture-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data/captures/network /data/captures/payloads /data/captures/sessions
              chmod -R 770 /data/captures
          volumeMounts:
            - name: capture-data
              mountPath: /data/captures
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        # --- Fake Rails Application ----------------------------------------
        - name: fake-rails
          image: rubyguardian/honeypot-rails:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http-rails
              containerPort: 3000
              protocol: TCP

          env:
            - name: RAILS_ENV
              value: production
            - name: HONEYPOT_MODE
              valueFrom:
                configMapKeyRef:
                  name: honeypot-config
                  key: honeypot_mode
            - name: CAPTURE_DIR
              value: /data/captures
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: honeypot-config
                  key: elasticsearch_url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: rubyguardian-secrets
                  key: honeypot_secret_key

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: capture-data
              mountPath: /data/captures

          livenessProbe:
            httpGet:
              path: /
              port: http-rails
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: http-rails
            initialDelaySeconds: 10
            periodSeconds: 10

        # --- Fake Gem Server -----------------------------------------------
        - name: fake-gem-server
          image: rubyguardian/honeypot-gems:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http-gems
              containerPort: 9292
              protocol: TCP

          env:
            - name: RACK_ENV
              value: production
            - name: HONEYPOT_MODE
              valueFrom:
                configMapKeyRef:
                  name: honeypot-config
                  key: honeypot_mode
            - name: CAPTURE_DIR
              value: /data/captures
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: honeypot-config
                  key: elasticsearch_url

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: capture-data
              mountPath: /data/captures

          livenessProbe:
            httpGet:
              path: /health
              port: http-gems
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http-gems
            initialDelaySeconds: 5
            periodSeconds: 10

        # --- Fake CI Runner ------------------------------------------------
        - name: fake-ci-runner
          image: rubyguardian/honeypot-ci:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http-ci
              containerPort: 8080
              protocol: TCP

          env:
            - name: HONEYPOT_MODE
              valueFrom:
                configMapKeyRef:
                  name: honeypot-config
                  key: honeypot_mode
            - name: CAPTURE_DIR
              value: /data/captures
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: honeypot-config
                  key: elasticsearch_url

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: capture-data
              mountPath: /data/captures

          livenessProbe:
            httpGet:
              path: /health
              port: http-ci
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http-ci
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: capture-data
          persistentVolumeClaim:
            claimName: honeypot-capture-data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: honeypot
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: honeypot
    app.kubernetes.io/part-of: rubyguardian

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: honeypot-capture-data
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: honeypot
    app.kubernetes.io/part-of: rubyguardian
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
# Network policy: honeypot accepts traffic from anywhere (it is intentionally exposed)
# but can only egress to Elasticsearch for telemetry shipping.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: honeypot-netpol
  namespace: rubyguardian
  labels:
    app.kubernetes.io/name: honeypot
    app.kubernetes.io/part-of: rubyguardian
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: honeypot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
        - port: 9292
          protocol: TCP
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - port: 9200
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
