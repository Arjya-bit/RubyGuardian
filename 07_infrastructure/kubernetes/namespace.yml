# =============================================================================
# RubyGuardian - Kubernetes Namespace
# =============================================================================
# Isolates all RubyGuardian workloads into a dedicated namespace with
# resource quotas and network policy defaults.
#
# Apply:
#   kubectl apply -f namespace.yml
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: rubyguardian
  labels:
    app.kubernetes.io/part-of: rubyguardian
    app.kubernetes.io/managed-by: kubectl
    environment: research
  annotations:
    description: "RubyGuardian security research framework namespace"
    contact: "security@rubyguardian.dev"

---
# Resource quota to prevent runaway workloads in shared clusters
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rubyguardian-quota
  namespace: rubyguardian
  labels:
    app.kubernetes.io/part-of: rubyguardian
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
    services: "15"
    persistentvolumeclaims: "10"
    configmaps: "20"
    secrets: "10"

---
# Limit ranges for individual pods/containers
apiVersion: v1
kind: LimitRange
metadata:
  name: rubyguardian-limits
  namespace: rubyguardian
  labels:
    app.kubernetes.io/part-of: rubyguardian
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi

---
# Default deny-all ingress network policy — each service explicitly allows
# the traffic it needs via its own NetworkPolicy resource.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: rubyguardian
  labels:
    app.kubernetes.io/part-of: rubyguardian
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow intra-namespace communication for RubyGuardian components
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: rubyguardian
  labels:
    app.kubernetes.io/part-of: rubyguardian
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rubyguardian
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rubyguardian
