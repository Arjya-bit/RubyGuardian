# =============================================================================
# RubyGuardian - Example Secrets Template
# =============================================================================
# IMPORTANT: This file is a TEMPLATE only.  Do NOT commit real secrets.
#
# Usage:
#   1. Copy this file:
#        cp example-secrets.yml secrets.yml
#   2. Replace all placeholder values with real credentials.
#   3. Apply to the cluster:
#        kubectl apply -f secrets.yml
#   4. NEVER commit secrets.yml to version control.
#
# Alternatively, use a secrets manager (Vault, AWS Secrets Manager, etc.)
# and the External Secrets Operator to inject secrets automatically.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: rubyguardian-secrets
  namespace: rubyguardian
  labels:
    app.kubernetes.io/part-of: rubyguardian
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Template for RubyGuardian secrets — replace placeholders before applying"
type: Opaque
stringData:
  # --- ML Classifier API key ---
  # Used by the detection agent and dashboard to authenticate against the
  # ML classifier API.  Generate with: openssl rand -hex 32
  classifier_api_key: "REPLACE_WITH_REAL_API_KEY"

  # --- Elasticsearch password ---
  # Password for the elastic superuser.  Only needed when xpack.security
  # is enabled.  Generate with: openssl rand -base64 24
  elasticsearch_password: "REPLACE_WITH_REAL_ES_PASSWORD"

  # --- Grafana admin password ---
  # Initial admin password for the Grafana dashboard.
  grafana_admin_password: "REPLACE_WITH_REAL_GRAFANA_PASSWORD"

  # --- Honeypot secret key base ---
  # Rails secret_key_base for the fake Rails honeypot.  The value does not
  # need to be truly secret since the app is a decoy, but Rails requires it.
  # Generate with: openssl rand -hex 64
  honeypot_secret_key: "REPLACE_WITH_GENERATED_SECRET_KEY_BASE"

  # --- Alerting webhook URL ---
  # Slack / Discord / PagerDuty webhook for critical alert forwarding.
  alerting_webhook_url: "REPLACE_WITH_WEBHOOK_URL"

  # --- TLS certificates (optional) ---
  # If terminating TLS at the ingress controller, place cert and key here.
  # tls_cert: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # tls_key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----
