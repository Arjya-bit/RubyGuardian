# RubyGuardian - Monitor VM Configuration
# Used by Vagrantfile to configure the ELK + dashboard host

network:
  ip: "172.28.0.10"
  netmask: "255.255.0.0"
  hostname: "rg-monitor"

resources:
  memory: 6144
  cpus: 4

elasticsearch:
  version: "8.11.0"
  heap_size: "2g"
  cluster_name: "ruby-guardian"
  network_host: "0.0.0.0"
  http_port: 9200

logstash:
  version: "8.11.0"
  heap_size: "1g"
  pipeline_config: /opt/rubyguardian/07_infrastructure/elk/logstash/pipeline

kibana:
  version: "8.11.0"
  server_host: "0.0.0.0"
  server_port: 5601

grafana:
  version: "10.2.0"
  admin_password: "ruby-guardian-dev"
  port: 3000

prometheus:
  version: "2.48.0"
  port: 9090
  scrape_interval: 15s
  targets:
    - "172.30.0.20:9100"  # target node_exporter
    - "172.29.0.20:9100"  # honeypot node_exporter

dashboard:
  enabled: true
  port: 5173
  api_url: "http://localhost:8000"

logging:
  level: info
  output: /var/log/ruby-guardian/monitor.log
