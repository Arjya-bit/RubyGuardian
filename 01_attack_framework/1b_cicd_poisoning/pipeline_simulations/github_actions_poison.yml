      # =====================================================================
      # RESEARCH: Detection Indicators
      # =====================================================================
      # Security teams should watch for these indicators:
      # - Workflows that use pull_request_target trigger
      # - Steps with ${{ }} expressions in run commands
      # - Steps that access ACTIONS_RUNTIME_TOKEN or OIDC tokens
      # - Unexplained outbound network connections from runners
      # - Modified workflow files in automated commits
      # - Cache keys that don't match expected patterns
