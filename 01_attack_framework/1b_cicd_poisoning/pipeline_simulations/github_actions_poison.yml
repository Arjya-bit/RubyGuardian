      # =====================================================================
      # ATTACK VECTOR 4: Cache Poisoning (COMMENTED OUT)
      # =====================================================================
      # Poisons the GitHub Actions cache so that future runs (including
      # other developers' builds) use compromised dependencies.
      #
      # - name: "Optimize dependency cache"
