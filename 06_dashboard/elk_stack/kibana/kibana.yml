# =============================================================================
# RubyGuardian - Kibana Configuration
# =============================================================================
# Visualization and exploration frontend for Elasticsearch security data

server.name: "ruby-guardian-kibana"
server.host: "0.0.0.0"
server.port: 5601
server.publicBaseUrl: "http://localhost:5601"

# Elasticsearch connection
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.password: "${ELASTICSEARCH_PASSWORD:changeme}"
elasticsearch.requestTimeout: 60000
elasticsearch.shardTimeout: 30000
elasticsearch.pingTimeout: 30000

# Security settings
xpack.security.enabled: true
xpack.encryptedSavedObjects.encryptionKey: "ruby-guardian-kibana-enc-key-32ch"
xpack.reporting.encryptionKey: "ruby-guardian-report-enc-key32ch"
xpack.security.encryptionKey: "ruby-guardian-sec-enc-key-32char"

# Session settings
xpack.security.session.idleTimeout: "1h"
xpack.security.session.lifespan: "24h"

# Logging configuration
logging:
  appenders:
    file:
      type: file
      fileName: /usr/share/kibana/logs/kibana.log
      layout:
        type: json
    console:
      type: console
      layout:
        type: pattern
        pattern: "[%date] [%level] [%logger] %message"
  root:
    appenders: [console, file]
    level: info
  loggers:
    - name: elasticsearch.query
      level: warn
    - name: http.server.response
      level: info
    - name: plugins.security
      level: info

# Saved objects management
savedObjects.maxImportPayloadBytes: 26214400

# Monitoring
monitoring.ui.enabled: true
monitoring.ui.container.elasticsearch.enabled: true

# Telemetry disabled for security
telemetry.enabled: false
telemetry.optIn: false

# Map settings
map.includeElasticMapsService: true

# Default index pattern
# This will be set by the dashboard import
kibana.defaultAppId: "dashboard/ruby-guardian-threat-overview"

# Newsfeed disabled
newsfeed.enabled: false

# CSP settings
csp.strict: true
csp.warnLegacyBrowsers: true

# UI settings
uiSettings:
  overrides:
    "theme:darkMode": true
    "dateFormat": "YYYY-MM-DD HH:mm:ss.SSS"
    "dateFormat:tz": "UTC"
    "defaultIndex": "rg-events-*"
    "discover:searchOnPageLoad": true
    "timepicker:timeDefaults": '{"from": "now-24h", "to": "now"}'
    "timepicker:refreshIntervalDefaults": '{"pause": false, "value": 30000}'
