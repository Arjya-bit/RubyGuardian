# =============================================================================
# RubyGuardian - Enrichment Filter Pipeline
# =============================================================================
# Enriches events with GeoIP, threat intelligence, and MITRE ATT&CK mappings

input {
  pipeline {
    address => "enrich-pipeline"
  }
}

filter {
  # =========================================================================
  # GeoIP Enrichment
  # =========================================================================
  if [network][source_ip] {
    geoip {
      source => "[network][source_ip]"
      target => "[geo]"
      database => "/usr/share/logstash/vendor/GeoLite2-City.mmdb"
      fields => ["location", "country_code2", "country_name", "city_name", "region_name"]
      tag_on_failure => ["_geoip_lookup_failure"]
    }

    # Rename fields to match our schema
    mutate {
      rename => {
        "[geo][country_code2]" => "[geo][country_iso_code]"
      }
    }

    # ASN enrichment
    geoip {
      source => "[network][source_ip]"
      target => "[geo]"
      database => "/usr/share/logstash/vendor/GeoLite2-ASN.mmdb"
      default_database_type => "ASN"
      fields => ["asn", "as_org"]
      tag_on_failure => ["_geoip_asn_lookup_failure"]
    }

    mutate {
      rename => {
        "[geo][as_org]" => "[geo][org]"
      }
    }
  }

  # =========================================================================
  # MITRE ATT&CK Mapping
  # =========================================================================
  if [attack][technique] {
    # Map Ruby-specific attack techniques to MITRE ATT&CK
    translate {
      source => "[attack][technique]"
      target => "[mitre][technique_id]"
      dictionary => {
        "process_hollowing"     => "T1055.012"
        "code_injection"        => "T1059.004"
        "eval_execution"        => "T1059"
        "gem_typosquatting"     => "T1195.002"
        "cicd_poisoning"        => "T1195.002"
        "dependency_confusion"  => "T1195.002"
        "lolruby_rake"          => "T1218"
        "lolruby_irb"           => "T1218"
        "lolruby_erb"           => "T1218"
        "lolruby_bundler"       => "T1218"
        "objectspace_abuse"     => "T1055"
        "method_hooking"        => "T1574"
        "require_hijack"        => "T1574.001"
        "gem_backdoor"          => "T1195.002"
        "reverse_shell"         => "T1059"
        "credential_access"     => "T1552"
        "data_exfiltration"     => "T1041"
        "persistence_cron"      => "T1053.003"
        "persistence_init"      => "T1037"
      }
      fallback => "T1059"
    }

    translate {
      source => "[attack][technique]"
      target => "[mitre][technique_name]"
      dictionary => {
        "process_hollowing"     => "Process Hollowing"
        "code_injection"        => "Command and Scripting Interpreter"
        "eval_execution"        => "Command and Scripting Interpreter"
        "gem_typosquatting"     => "Supply Chain Compromise: Compromise Software Dependencies"
        "cicd_poisoning"        => "Supply Chain Compromise: Compromise Software Dependencies"
        "dependency_confusion"  => "Supply Chain Compromise: Compromise Software Dependencies"
        "lolruby_rake"          => "System Binary Proxy Execution"
        "lolruby_irb"           => "System Binary Proxy Execution"
        "lolruby_erb"           => "System Binary Proxy Execution"
        "lolruby_bundler"       => "System Binary Proxy Execution"
        "objectspace_abuse"     => "Process Injection"
        "method_hooking"        => "Hijack Execution Flow"
        "require_hijack"        => "Hijack Execution Flow: DLL Search Order Hijacking"
        "gem_backdoor"          => "Supply Chain Compromise: Compromise Software Dependencies"
        "reverse_shell"         => "Command and Scripting Interpreter"
        "credential_access"     => "Unsecured Credentials"
        "data_exfiltration"     => "Exfiltration Over C2 Channel"
        "persistence_cron"      => "Scheduled Task/Job: Cron"
        "persistence_init"      => "Boot or Logon Initialization Scripts"
      }
      fallback => "Unknown Technique"
    }

    translate {
      source => "[attack][technique]"
      target => "[mitre][tactic]"
      dictionary => {
        "process_hollowing"     => "defense-evasion"
        "code_injection"        => "execution"
        "eval_execution"        => "execution"
        "gem_typosquatting"     => "initial-access"
        "cicd_poisoning"        => "initial-access"
        "dependency_confusion"  => "initial-access"
        "lolruby_rake"          => "defense-evasion"
        "lolruby_irb"           => "defense-evasion"
        "lolruby_erb"           => "defense-evasion"
        "lolruby_bundler"       => "defense-evasion"
        "objectspace_abuse"     => "defense-evasion"
        "method_hooking"        => "persistence"
        "require_hijack"        => "persistence"
        "gem_backdoor"          => "initial-access"
        "reverse_shell"         => "execution"
        "credential_access"     => "credential-access"
        "data_exfiltration"     => "exfiltration"
        "persistence_cron"      => "persistence"
        "persistence_init"      => "persistence"
      }
      fallback => "unknown"
    }
  }

  # =========================================================================
  # Threat Intelligence Enrichment
  # =========================================================================
  # Check against known malicious IPs (loaded from file)
  if [network][source_ip] {
    translate {
      source => "[network][source_ip]"
      target => "[threat_intel][ip_reputation]"
      dictionary_path => "/usr/share/logstash/config/threat_intel_ips.yml"
      fallback => "unknown"
      refresh_interval => 300
    }

    if [threat_intel][ip_reputation] and [threat_intel][ip_reputation] != "unknown" {
      mutate {
        add_tag => ["threat_intel_match"]
      }
    }
  }

  # Check file hashes against known malware signatures
  if [file][hash_sha256] {
    translate {
      source => "[file][hash_sha256]"
      target => "[threat_intel][hash_reputation]"
      dictionary_path => "/usr/share/logstash/config/threat_intel_hashes.yml"
      fallback => "unknown"
      refresh_interval => 300
    }

    if [threat_intel][hash_reputation] and [threat_intel][hash_reputation] != "unknown" {
      mutate {
        add_tag => ["known_malware_hash"]
      }

      # Boost threat score for known malicious hashes
      if [threat_score] {
        ruby {
          code => '
            current_score = event.get("threat_score") || 0.0
            boosted = [1.0, current_score + 0.3].min
            event.set("threat_score", boosted)
          '
        }
      }
    }
  }

  # =========================================================================
  # Event Deduplication
  # =========================================================================
  fingerprint {
    source => ["event_id", "capture_id", "report_id", "classification_id"]
    target => "[@metadata][dedup_key]"
    method => "SHA256"
    concatenate_sources => true
  }
}

output {
  pipeline {
    send_to => ["normalize-pipeline"]
  }
}
