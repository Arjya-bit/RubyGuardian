# =============================================================================
# RubyGuardian - Agent Input Pipeline
# =============================================================================
# Receives security events from RubyGuardian agents deployed on monitored hosts

input {
  # HTTP input for agent event submissions
  http {
    host => "0.0.0.0"
    port => 5044
    codec => json
    type => "agent_event"
    ssl_enabled => false
    threads => 4
    additional_codecs => {
      "application/json" => "json"
    }
    response_headers => {
      "X-RubyGuardian" => "logstash-agent-input"
    }
  }

  # Beats input for Filebeat-based agent delivery
  beats {
    port => 5045
    type => "agent_beat"
    ssl_enabled => false
  }

  # TCP input for direct agent connections
  tcp {
    port => 5046
    codec => json_lines
    type => "agent_tcp"
  }

  # Kafka input for high-throughput environments
  # kafka {
  #   bootstrap_servers => "${KAFKA_BROKERS:kafka:9092}"
  #   topics => ["ruby-guardian-events"]
  #   group_id => "rg-logstash-agent"
  #   codec => json
  #   type => "agent_kafka"
  #   consumer_threads => 3
  #   decorate_events => "extended"
  # }
}

filter {
  # Validate required fields
  if ![event_type] {
    mutate {
      add_field => { "event_type" => "unknown" }
      add_tag => ["_missing_event_type"]
    }
  }

  # Parse timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss Z", "UNIX"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Add source metadata
  mutate {
    add_field => {
      "[@metadata][pipeline]" => "agent"
      "[@metadata][index_prefix]" => "rg-events"
    }
  }

  # Parse agent identification
  if [agent][id] {
    fingerprint {
      source => ["[agent][id]", "[event_id]"]
      target => "[@metadata][document_id]"
      method => "SHA256"
    }
  }

  # Parse Ruby-specific fields
  if [ruby][code_snippet] {
    # Detect eval/exec patterns in code
    ruby {
      code => '
        snippet = event.get("[ruby][code_snippet]")
        if snippet
          eval_detected = snippet.match?(/\b(eval|instance_eval|class_eval|module_eval|binding\.eval)\b/)
          exec_detected = snippet.match?(/\b(exec|system|`|%x|IO\.popen|Open3|Kernel\.exec)\b/)
          event.set("[ruby][eval_detected]", eval_detected || exec_detected)

          # Calculate simple obfuscation score
          base64_layers = snippet.scan(/Base64\.decode64/).length
          unpack_calls = snippet.scan(/\.unpack/).length
          hex_strings = snippet.scan(/\\x[0-9a-fA-F]{2}/).length
          score = [1.0, (base64_layers * 0.2 + unpack_calls * 0.15 + hex_strings * 0.01)].min
          event.set("[ruby][obfuscation_score]", score)
        end
      '
    }
  }

  # Classify threat level from threat_score
  if [threat_score] {
    if [threat_score] >= 0.9 {
      mutate { add_field => { "severity" => "critical" } }
    } else if [threat_score] >= 0.7 {
      mutate { add_field => { "severity" => "high" } }
    } else if [threat_score] >= 0.4 {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
  }
}

output {
  pipeline {
    send_to => ["enrich-pipeline"]
  }
}
