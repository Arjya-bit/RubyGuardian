# =============================================================================
# RubyGuardian - Honeypot Input Pipeline
# =============================================================================
# Receives captured attack data from RubyGuardian honeypot sensors

input {
  # HTTP input for honeypot capture submissions
  http {
    host => "0.0.0.0"
    port => 5047
    codec => json
    type => "honeypot_capture"
    ssl_enabled => false
    threads => 2
    response_headers => {
      "X-RubyGuardian" => "logstash-honeypot-input"
    }
  }

  # TCP input for streaming honeypot data
  tcp {
    port => 5048
    codec => json_lines
    type => "honeypot_stream"
  }

  # File input for batch honeypot log ingestion
  file {
    path => "/var/log/ruby-guardian/honeypot/*.json"
    type => "honeypot_file"
    codec => json
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_honeypot"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/logs/honeypot_completed.log"
  }
}

filter {
  # Parse timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss Z", "UNIX"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Add pipeline metadata
  mutate {
    add_field => {
      "[@metadata][pipeline]" => "honeypot"
      "[@metadata][index_prefix]" => "rg-honeypot"
    }
  }

  # Generate document ID from capture_id
  if [capture_id] {
    fingerprint {
      source => ["capture_id"]
      target => "[@metadata][document_id]"
      method => "SHA256"
    }
  }

  # Parse attacker IP and enrich with GeoIP
  if [attacker][ip] {
    geoip {
      source => "[attacker][ip]"
      target => "[attacker][geo]"
      database => "/usr/share/logstash/vendor/GeoLite2-City.mmdb"
      fields => ["location", "country_code2", "country_name", "city_name"]
      tag_on_failure => ["_geoip_lookup_failure"]
    }

    geoip {
      source => "[attacker][ip]"
      target => "[attacker][geo]"
      database => "/usr/share/logstash/vendor/GeoLite2-ASN.mmdb"
      default_database_type => "ASN"
      fields => ["asn", "as_org"]
      tag_on_failure => ["_geoip_asn_lookup_failure"]
    }
  }

  # Analyze interaction patterns
  if [interaction][commands] {
    ruby {
      code => '
        commands = event.get("[interaction][commands]")
        if commands.is_a?(String)
          cmd_list = commands.split("\n")
          event.set("[interaction][command_count]", cmd_list.length)

          # Detect common attack patterns
          patterns = []
          patterns << "reconnaissance" if commands.match?(/\b(whoami|id|uname|hostname|ifconfig|ip\s+addr)\b/)
          patterns << "privilege_escalation" if commands.match?(/\b(sudo|su\s|chmod\s+[47]|chown)\b/)
          patterns << "persistence" if commands.match?(/\b(crontab|systemctl|\.bashrc|\.profile|authorized_keys)\b/)
          patterns << "exfiltration" if commands.match?(/\b(curl|wget|nc\s|scp|rsync)\b/)
          patterns << "ruby_exploit" if commands.match?(/\b(eval|require|gem\s+install|bundle|irb|ruby\s+-e)\b/)

          event.set("[classification][detected_patterns]", patterns) unless patterns.empty?
        end
      '
    }
  }

  # Classify sophistication level
  if [interaction][command_count] {
    ruby {
      code => '
        cmd_count = event.get("[interaction][command_count]") || 0
        duration = event.get("[interaction][duration_ms]") || 0
        files_count = 0
        files = event.get("[interaction][files_uploaded]")
        files_count = files.length if files.is_a?(Array)

        score = 0
        score += 1 if cmd_count > 10
        score += 1 if duration > 60000
        score += 1 if files_count > 0
        score += 1 if event.get("[ruby_exploit][technique]")
        score += 1 if event.get("[ruby_exploit][cve]")

        sophistication = case score
          when 0..1 then "low"
          when 2..3 then "medium"
          else "high"
        end

        event.set("[classification][sophistication]", sophistication)
      '
    }
  }

  # Check for known automated tools
  if [attacker][user_agent] {
    ruby {
      code => '
        ua = event.get("[attacker][user_agent]") || ""
        known_tools = {
          "Nikto" => "nikto",
          "sqlmap" => "sqlmap",
          "Nmap" => "nmap",
          "ZmEu" => "zmeu",
          "Masscan" => "masscan",
          "python-requests" => "python_script",
          "Go-http-client" => "go_script",
          "curl/" => "curl"
        }

        known_tools.each do |pattern, tool_name|
          if ua.include?(pattern)
            event.set("[classification][automation_detected]", true)
            event.set("[classification][known_tool]", tool_name)
            break
          end
        end
      '
    }
  }
}

output {
  pipeline {
    send_to => ["enrich-pipeline"]
  }
}
