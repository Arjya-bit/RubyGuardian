# =============================================================================
# RubyGuardian - Forensics Input Pipeline
# =============================================================================
# Receives forensic analysis data: memory dumps, ObjectSpace snapshots, reports

input {
  # HTTP input for forensic report submissions
  http {
    host => "0.0.0.0"
    port => 5049
    codec => json
    type => "forensic_report"
    ssl_enabled => false
    threads => 2
    max_content_length => 104857600
    response_headers => {
      "X-RubyGuardian" => "logstash-forensics-input"
    }
  }

  # TCP input for streaming forensic data
  tcp {
    port => 5050
    codec => json_lines
    type => "forensic_stream"
  }

  # File input for batch forensic data ingestion
  file {
    path => "/var/log/ruby-guardian/forensics/*.json"
    type => "forensic_file"
    codec => json
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_forensics"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/logs/forensic_completed.log"
  }

  # ML classification results input
  http {
    host => "0.0.0.0"
    port => 5051
    codec => json
    type => "ml_classification"
    ssl_enabled => false
    threads => 2
    response_headers => {
      "X-RubyGuardian" => "logstash-ml-input"
    }
  }
}

filter {
  # Parse timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss Z", "UNIX"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Route to appropriate index based on type
  if [type] == "ml_classification" {
    mutate {
      add_field => {
        "[@metadata][pipeline]" => "ml"
        "[@metadata][index_prefix]" => "rg-ml"
      }
    }
  } else {
    mutate {
      add_field => {
        "[@metadata][pipeline]" => "forensics"
        "[@metadata][index_prefix]" => "rg-forensic"
      }
    }
  }

  # Generate document ID
  if [report_id] {
    fingerprint {
      source => ["report_id"]
      target => "[@metadata][document_id]"
      method => "SHA256"
    }
  } else if [classification_id] {
    fingerprint {
      source => ["classification_id"]
      target => "[@metadata][document_id]"
      method => "SHA256"
    }
  }

  # Process memory dump metadata
  if [memory_dump] {
    ruby {
      code => '
        regions = event.get("[memory_dump][regions]")
        if regions.is_a?(Array)
          suspicious_count = regions.count { |r| r["suspicious"] == true }
          high_entropy_count = regions.count { |r| (r["entropy"] || 0) > 7.0 }

          event.set("[memory_dump][suspicious_region_count]", suspicious_count)
          event.set("[memory_dump][high_entropy_region_count]", high_entropy_count)

          if suspicious_count > 0 || high_entropy_count > 0
            event.set("[memory_dump][injected_code_detected]", true)
          end
        end
      '
    }
  }

  # Process ObjectSpace data
  if [objectspace] {
    ruby {
      code => '
        class_dist = event.get("[objectspace][class_distribution]")
        if class_dist.is_a?(Array)
          anomalous = class_dist.select { |c| (c["anomaly_score"] || 0) > 0.7 }
          event.set("[objectspace][anomalous_class_count]", anomalous.length)

          total_objects = class_dist.sum { |c| c["count"] || 0 }
          event.set("[objectspace][total_objects]", total_objects)
        end

        suspicious = event.get("[objectspace][suspicious_objects]")
        if suspicious.is_a?(Array)
          event.set("[objectspace][suspicious_object_count]", suspicious.length)
        end
      '
    }
  }

  # Process ML classification results
  if [type] == "ml_classification" and [result] {
    # Ensure confidence is within bounds
    ruby {
      code => '
        confidence = event.get("[result][confidence]") || 0.0
        confidence = [[confidence, 0.0].max, 1.0].min
        event.set("[result][confidence]", confidence)

        # Set risk level based on confidence and classification
        classification = event.get("[result][classification]") || "unknown"
        is_malicious = ["malicious", "process_hollowing", "cicd_poisoning", "lolruby", "objectspace_abuse", "code_injection"].include?(classification)
        event.set("[result][is_malicious]", is_malicious)

        risk_level = if is_malicious && confidence > 0.8
          "critical"
        elsif is_malicious && confidence > 0.5
          "high"
        elsif classification == "suspicious"
          "medium"
        else
          "low"
        end
        event.set("[result][risk_level]", risk_level)
      '
    }
  }

  # Build forensic timeline entries
  if [timeline] and [timeline].is_a?(Array) {
    ruby {
      code => '
        timeline = event.get("[timeline]")
        if timeline.is_a?(Array)
          sorted = timeline.sort_by { |e| e["timestamp"] || "" }
          event.set("[timeline]", sorted)
          event.set("[timeline_entry_count]", sorted.length)
        end
      '
    }
  }
}

output {
  pipeline {
    send_to => ["enrich-pipeline"]
  }
}
