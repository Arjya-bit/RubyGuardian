; =============================================================================
; RubyGuardian - Grafana Configuration
; =============================================================================
; Metrics visualization and system health monitoring

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false
enforce_domain = false

[database]
type = sqlite3
path = grafana.db
cache_mode = shared

[session]
provider = file
provider_config = sessions
cookie_name = grafana_sess
cookie_secure = false
session_life_time = 86400

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD:RubyGuardian2024!}
secret_key = ruby_guardian_grafana_secret_key_change_me
disable_gravatar = true
cookie_secure = false
cookie_samesite = lax
allow_embedding = true
content_security_policy = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
default_theme = dark
viewers_can_edit = true

[auth]
disable_login_form = false
disable_signout_menu = false
login_cookie_name = grafana_session

[auth.anonymous]
enabled = true
org_name = RubyGuardian
org_role = Viewer

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/system_health.json
min_refresh_interval = 5s

[alerting]
enabled = true
execute_alerts = true
evaluation_timeout_seconds = 30
notification_timeout_seconds = 30
max_attempts = 3

[log]
mode = console file
level = info
filters = alerting.notifier:warn

[log.console]
level = info
format = json

[log.file]
level = info
format = json
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

[metrics]
enabled = true
interval_seconds = 60

[plugins]
enable_alpha = false
allow_loading_unsigned_plugins =

[unified_alerting]
enabled = true
min_interval = 10s

[feature_toggles]
enable = publicDashboards
