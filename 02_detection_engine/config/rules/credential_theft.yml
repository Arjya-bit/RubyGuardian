# RubyGuardian Detection Rule: Credential Access Patterns
# Detects techniques used to steal credentials including LSASS memory
# access, SAM database dumping, and credential file harvesting.
#
# References:
#   - MITRE ATT&CK TA0006 (Credential Access)
#   - https://attack.mitre.org/tactics/TA0006/

---
rules:
  - id: CRED-001
    name: LSASS Memory Access
    description: >
      Detects suspicious access to the LSASS process memory, which is a
      primary target for credential dumping tools such as Mimikatz,
      ProcDump, and comsvcs.dll MiniDump.
    severity: critical
    status: enabled
    tags:
      - credential_theft
      - lsass_access
      - mimikatz
    mitre_attack:
      tactics:
        - Credential Access
      techniques:
        - T1003
        - T1003.001
    conditions:
      and:
        - field: event_type
          op: eq
          value: process_access
        - field: target_process.name
          op: eq
          value: lsass.exe
        - field: access_mask
          op: in
          value:
            - "0x1010"      # PROCESS_QUERY_LIMITED_INFORMATION | PROCESS_VM_READ
            - "0x1410"      # Above + PROCESS_DUP_HANDLE
            - "0x1F0FFF"    # PROCESS_ALL_ACCESS
            - "0x1FFFFF"    # Full access
        - not:
            - field: source_process.name
              op: in
              value:
                - csrss.exe
                - lsass.exe
                - svchost.exe
                - MsMpEng.exe
                - taskmgr.exe
                - procexp64.exe
                - vmtoolsd.exe
    response:
      alert: true
      collect_memory_dump: true
      isolate_host: true
      priority: P1

  - id: CRED-002
    name: SAM Database Access or Dump
    description: >
      Detects attempts to access or copy the SAM, SYSTEM, or SECURITY
      registry hives which contain local account password hashes.
    severity: high
    status: enabled
    tags:
      - credential_theft
      - sam_dump
      - registry_hive
    mitre_attack:
      tactics:
        - Credential Access
      techniques:
        - T1003.002
    conditions:
      or:
        - and:
            - field: event_type
              op: eq
              value: registry_access
            - field: registry_key
              op: matches
              value: "HKLM\\\\SAM|HKLM\\\\SECURITY|HKLM\\\\SYSTEM"
            - field: access_type
              op: in
              value:
                - save
                - export
                - backup
        - and:
            - field: event_type
              op: eq
              value: process_create
            - field: command_line
              op: matches
              value: "reg\\s+save\\s+.*(sam|system|security)|secretsdump|pwdump|samdump"
        - and:
            - field: event_type
              op: eq
              value: file_create
            - field: file_path
              op: matches
              value: "\\\\(SAM|SYSTEM|SECURITY)(\\.|$)"
            - field: source_process.name
              op: not_in
              value:
                - svchost.exe
                - smss.exe
    response:
      alert: true
      collect_memory_dump: false

  - id: CRED-003
    name: Mimikatz Command Line Indicators
    description: >
      Detects known Mimikatz command line patterns including sekurlsa,
      lsadump, kerberos, and dpapi module invocations.
    severity: critical
    status: enabled
    tags:
      - credential_theft
      - mimikatz
    mitre_attack:
      tactics:
        - Credential Access
      techniques:
        - T1003.001
        - T1558.003
    conditions:
      and:
        - field: event_type
          op: in
          value:
            - process_create
            - script_execution
        - or:
            - field: command_line
              op: matches
              value: "sekurlsa::|lsadump::|kerberos::|crypto::|dpapi::|privilege::debug"
            - field: command_line
              op: matches
              value: "Invoke-Mimikatz|mimikatz\\.exe|mimi32|mimi64"
            - field: command_line
              op: contains
              value: "logonPasswords"
    response:
      alert: true
      isolate_host: true
      priority: P1

  - id: CRED-004
    name: Credential File Harvesting
    description: >
      Detects access to files commonly containing credentials such as
      browser credential stores, SSH keys, and cloud configuration files.
    severity: medium
    status: enabled
    tags:
      - credential_theft
      - file_access
    mitre_attack:
      tactics:
        - Credential Access
        - Collection
      techniques:
        - T1552
        - T1552.001
    conditions:
      and:
        - field: event_type
          op: eq
          value: file_access
        - field: access_type
          op: in
          value:
            - read
            - copy
        - or:
            - field: file_path
              op: matches
              value: "Login Data|Cookies|Web Data|logins\\.json|key[34]\\.db"
            - field: file_path
              op: matches
              value: "\\.ssh[\\\\/](id_rsa|id_ed25519|known_hosts|authorized_keys)"
            - field: file_path
              op: matches
              value: "\\.aws[\\\\/]credentials|\\.azure[\\\\/]accessTokens"
            - field: file_path
              op: matches
              value: "credentials\\.xml|web\\.config|appsettings\\.json"
        - not:
            - field: source_process.name
              op: in
              value:
                - chrome.exe
                - firefox.exe
                - explorer.exe
                - svchost.exe
                - Code.exe
    response:
      alert: true
      collect_memory_dump: false

  - id: CRED-005
    name: Kerberoasting Activity
    description: >
      Detects Kerberos ticket requests for service accounts that may
      indicate Kerberoasting activity to crack service account passwords.
    severity: high
    status: enabled
    tags:
      - credential_theft
      - kerberoasting
      - active_directory
    mitre_attack:
      tactics:
        - Credential Access
      techniques:
        - T1558.003
    conditions:
      and:
        - field: event_type
          op: eq
          value: kerberos_tgs_request
        - field: encryption_type
          op: in
          value:
            - "0x17"    # RC4-HMAC
            - "0x18"    # RC4-HMAC-EXP
        - field: service_name
          op: not_in
          value:
            - krbtgt
            - kadmin
        - field: request_count
          op: gte
          value: 5
    response:
      alert: true
      priority: P2
